[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scicontext"
version = "0.1.0"
description = "Scientific representation extraction before Codex repair"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5", "pint==0.24.4", "fortls>=3.2,<4",
  "tree-sitter>=0.25,<0.26", "tree-sitter-c==0.24.2", "tree-sitter-cpp==0.23.4",
  "tree-sitter-fortran==0.6.0", "tree-sitter-matlab==1.3.1", "Cython>=3.1,<4",
]

[project.optional-dependencies]
test = [
    "numpy>=2.5.3",
    "pytest>=8,<10",
]
runner = ["datacurve-pier==0.3.0"]

[project.scripts]
scicontext = "scicontext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scicontext = ["*.schema.json", "*.sc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
