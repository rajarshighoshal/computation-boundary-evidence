[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scicontext"
version = "0.1.0"
description = "Scientific representation extraction before Codex repair"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5", "pint==0.24.4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
runner = ["datacurve-pier==0.3.0"]

[project.scripts]
scicontext = "scicontext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scicontext = ["*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
